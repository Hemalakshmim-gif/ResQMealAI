services:
  backend:
    build:
      context: ./backend
    container_name: nourivya-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: nourivya-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
